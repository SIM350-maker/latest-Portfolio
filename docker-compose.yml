services:
  portfolio:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      # Container runtime values — override env_file so a local-developer .env
      # never leaks into the container. Phase 3 cutover: the app runs on Neon
      # PostgreSQL via DATABASE_URL (passed through env_file, no $ escapes
      # needed); NODE_ENV forced to production in the container.
      NODE_ENV: production
      PORT: "3000"
      # Rollback path: DB_PATH + the ./data volume keep the legacy SQLite
      # database available; the SQLite driver activates only with an explicit
      # DB_DRIVER=sqlite or when DATABASE_URL is absent.
      DB_PATH: /data/portfolio.db
    volumes: ["./data:/data"]
