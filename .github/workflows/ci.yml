name: ci
on: [push, pull_request]
jobs:
  # Primary lane: hermetic SQLite (per-worker throwaway file DBs).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  # PostgreSQL matrix lane: the full suite runs against a real PostgreSQL
  # service (the production data layer's dialect), serially against one
  # schema-reset database (see tests/jest-global-setup.js).
  verify-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test -- --runInBand

  # Accessibility sweep (axe-core, WCAG): public + authenticated manage pages.
  # Non-blocking first (roadmap INC-010 staging); flip to blocking once stable.
  a11y:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:a11y
